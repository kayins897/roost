<style>
  /* Standalone shell: dark theme tokens + the host utilities the fragment
     expects (form controls, buttons, controls rows). Zero dependencies. */
  :root {
    --background: #101014;
    --foreground: #f4f2ec;
    --muted-foreground: #a8a39a;
    --border: #3a3730;
    --accent-soft: #332b1d;
    --control-selected-border: #ddc18b;
    --control-hover-border: #c6a66580;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 26px clamp(14px, 3vw, 40px) 40px;
    background: var(--background);
    color: var(--foreground);
    font-family: Inter, 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .text-muted { color: var(--muted-foreground); }
  .viz-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .form-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .form-check-input {
    appearance: none; position: relative; width: 36px; height: 21px; margin: 0;
    border-radius: 999px; background: #211f1b; border: 1px solid var(--border);
    cursor: pointer; transition: background .15s, border-color .15s; flex: none;
  }
  .form-check-input::before {
    content: ''; position: absolute; left: 3px; top: 3px; width: 13px; height: 13px;
    border-radius: 50%; background: #a8a39a; transition: transform .18s, background .18s;
  }
  .form-check-input:checked { background: var(--accent-soft); border-color: #a58b58; }
  .form-check-input:checked::before { transform: translateX(14px); background: #d7ba7d; }
  .form-check-label { font-size: 13px; user-select: none; }
  .form-range {
    appearance: none; width: 100%; height: 6px; margin: 0; padding: 0;
    border-radius: 999px; background: linear-gradient(90deg, var(--accent-soft), #211f1b);
    border: 1px solid var(--border); cursor: pointer;
  }
  .form-range::-webkit-slider-thumb {
    appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #d7ba7d; border: 1px solid var(--control-selected-border);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.5);
  }
  .form-range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #d7ba7d; border: 1px solid var(--control-selected-border); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid var(--border); background: #211f1b;
    color: var(--foreground); font-size: 13px; font-family: inherit; cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover { border-color: var(--control-hover-border); }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--control-selected-border); }
  .btn:focus-visible { outline: 2px solid rgb(215 186 125 / 0.7); outline-offset: 2px; }
</style>

<script>
/* Standalone persistence shim: the fragment talks to the ZCode widget-state
   host; here the same calls map to localStorage so settings survive reloads. */
window.zcode = {
  widgetState: (() => {
    try { const raw = localStorage.getItem('mr-recreation-state'); return raw ? { modelContent: JSON.parse(raw) } : null; }
    catch (e) { return null; }
  })(),
  setWidgetState(state) {
    try { localStorage.setItem('mr-recreation-state', JSON.stringify(state && state.modelContent ? state.modelContent : null)); } catch (e) {}
    return Promise.resolve();
  },
};
</script>

  <script>
  (() => {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const stage = $('mr-stage');
    const fluidCv = $('mr-fluid');
    const starCv = $('mr-stars');
    const fluidToggle = $('mr-fluid-on');
    const starsToggle = $('mr-stars-on');
    const parallaxInput = $('mr-parallax');
    const densityInput = $('mr-density');
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fluidOn = () => fluidToggle.checked;
    const starsOn = () => starsToggle.checked;
    const fract = (n) => n - Math.floor(n);
    const hash = (n) => fract(Math.sin(n) * 43758.5453123);

    /* ---------- palette: port of fluid-tones.ts (dark scheme, depth 50) ---------- */
    function hsl(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
      const hex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
      return '#' + hex(r) + hex(g) + hex(b);
    }
    const toneColors = (hue, depth) => {
      // port of fluidToneColors (dark scheme): piecewise depth ramp,
      // 0 = near-black deep stop, 100 = pale wash; theme default depth = 22
      const d = Math.min(1, Math.max(0, (depth === undefined ? 22 : depth) / 100));
      const ramp = (deep, mid, pale) => (d < 0.5 ? deep + ((mid - deep) * d) / 0.5 : mid + ((pale - mid) * (d - 0.5)) / 0.5);
      return {
        color1: hsl(hue, 0.85, ramp(0, 0.46, 0.62)),
        color2: hsl(hue, 0.9, ramp(0, 0.305, 0.45)),
        color3: hsl(hue, 0.5, ramp(0, 0.075, 0.10)),
      };
    };

    /* ================= fluid board: two-pass WebGL2 flow-map sim ================= */
    const VERT = `#version 300 es
in vec4 a_position;
out vec2 vUv;
void main() {
  vUv = a_position.xy * 0.5 + 0.5;
  gl_Position = a_position;
}`;

    const FLOW_FRAG = `#version 300 es
precision mediump float;
in vec2 vUv;
uniform sampler2D u_prev;
uniform vec2 u_mouse;
uniform vec2 u_velocity;
uniform float u_brushRadius;
uniform float u_brushStrength;
uniform float u_decay;
out vec4 fragColor;
void main() {
  vec4 prev = texture(u_prev, vUv);
  prev.r *= u_decay;
  prev.gb = mix(vec2(0.5), prev.gb, u_decay);
  float dist = distance(vUv, u_mouse);
  float influence = exp(-dist * dist / (u_brushRadius * u_brushRadius * 0.5));
  influence = max(0.0, influence - 0.01);
  float speed = length(u_velocity);
  float presenceStrength = u_brushStrength * 0.3;
  float velBonus = min(speed * 3.0, 0.7) * u_brushStrength;
  float totalStrength = presenceStrength + velBonus;
  prev.r = max(prev.r, influence * totalStrength);
  float blendAmt = influence * min(totalStrength, 0.4) * 0.3;
  prev.g = mix(prev.g, clamp(u_velocity.x * 2.0 + 0.5, 0.0, 1.0), blendAmt);
  prev.b = mix(prev.b, clamp(u_velocity.y * 2.0 + 0.5, 0.0, 1.0), blendAmt);
  fragColor = prev;
}`;

    const DISPLAY_FRAG = `#version 300 es
precision mediump float;
in vec2 vUv;
uniform float u_time;
uniform float u_pixelRatio;
uniform vec2 u_resolution;
uniform float u_scale;
uniform float u_rotation;
uniform vec4 u_color1, u_color2, u_color3;
uniform float u_colorCount;
uniform float u_proportion;
uniform float u_softness;
uniform float u_shape;
uniform float u_shapeScale;
uniform float u_distortion;
uniform float u_swirl;
uniform float u_swirlIterations;
uniform vec2 u_offset;

    function buildLogoMask() {

      const ny = (-drift.smy * 26 + idleY * 12) * a;

    // small and stretched by feImage like the kit (rasterScale 0.2).
    function buildLensMap(cssW, cssH, radius, depth, curvature) {
      const raster = 0.2;
      const w = Math.max(1, Math.round(cssW * raster));
      const h = Math.max(1, Math.round(cssH * raster));

      const rPx = Math.max(1, Math.min(radius * raster, Math.min(w, h) / 2));
      const edge = Math.max(0.5, depth * raster);
      const cx = w / 2, cy = h / 2;
      const hw = w / 2 - rPx, hh = h / 2 - rPx;
      const halfW = Math.ceil(w / 2), halfH = Math.ceil(h / 2);
      const put = (x, y, dx, dy) => {
        const R = (y * w + x) * 4;

      for (let y = 0; y < halfH; y++) {
        const xMax = (y + 0.5 >= edge) ? Math.min(halfW, Math.ceil(Math.max(rPx, edge))) : halfW;
        for (let x = 0; x < xMax; x++) {
          const px = x + 0.5, py = y + 0.5;
          const S = Math.abs(px - cx) - hw;
          const C = Math.abs(py - cy) - hh;
          const k = Math.max(S, 0), P = Math.max(C, 0);
          const E = Math.hypot(k, P);
          const sdf = E + Math.min(Math.max(S, C), 0) - rPx;

          const dy = encodeDisp(-ny * mag);
          put(x, y, dx, dy);
          const mx = w - 1 - x, my = h - 1 - y;
          if (mx !== x) put(mx, y, 256 - dx, dy);
          if (my !== y) put(x, my, dx, 256 - dy);
          if (mx !== x && my !== y) put(mx, my, 256 - dx, 256 - dy);

      canvas.height = h;

    }

      const fy = (-pad / cssH * 100).toFixed(4);

    bindFluidSlider(radiusInput, 'mr-radius-val', applyFluidParams);
    const logechoInput = $('mr-logecho');
    bindFluidSlider(logechoInput, 'mr-logecho-val', (v) => v, (v) => { logoEcho = v; });

    const gblurInput = $('mr-gblur');
    const grefractionInput = $('mr-grefraction');
    const gdispersionInput = $('mr-gdispersion');
    const gdepthInput = $('mr-gdepth');
    const gelasticityInput = $('mr-gelasticity');
    const bindGlassSlider = (input, valId, fmt, apply) => {
      input.addEventListener('input', () => {
        $(valId).textContent = fmt(input.value);
        apply(Number(input.value));
        saveState();
      });
    };
    bindGlassSlider(gblurInput, 'mr-gblur-val', (v) => v, (v) => { GLASS.blur = v; rebuildAllPanes(); });
    bindGlassSlider(grefractionInput, 'mr-grefraction-val', (v) => v + '%', (v) => { GLASS.refraction = v / 100; rebuildAllPanes(); });
    bindGlassSlider(gdispersionInput, 'mr-gdispersion-val', (v) => v + '%', (v) => { GLASS.dispersion = v / 100; rebuildAllPanes(); });
    bindGlassSlider(gdepthInput, 'mr-gdepth-val', (v) => v, (v) => { GLASS.depth = v; rebuildAllPanes(); });
    bindGlassSlider(gelasticityInput, 'mr-gelasticity-val', (v) => v + '%', (v) => { GLASS.elasticity = v / 100; });

    $('mr-reset').addEventListener('click', () => {
      const defaults = { parallax: '100', density: '60', depth: '22', speed: '14', swirl: '12', distort: '20', strength: '0', radius: '0.22' };
      parallaxInput.value = defaults.parallax;
      drift.amp = Number(defaults.parallax) / 100;
      $('mr-parallax-val').textContent = defaults.parallax + '%';
      densityInput.value = defaults.density;
      starsDensity = Number(defaults.density);
      $('mr-density-val').textContent = defaults.density;
      buildStars();
      depthInput.value = defaults.depth;
      currentDepth = Number(defaults.depth);
      $('mr-depth-val').textContent = defaults.depth;
      speedInput.value = defaults.speed;
      swirlInput.value = defaults.swirl;
      distortInput.value = defaults.distort;
      strengthInput.value = '0';
      radiusInput.value = defaults.radius;
      $('mr-speed-val').textContent = defaults.speed;
      $('mr-swirl-val').textContent = defaults.swirl;
      $('mr-distort-val').textContent = defaults.distort;
      $('mr-strength-val').textContent = '0';
      $('mr-radius-val').textContent = defaults.radius;
      fluidToggle.checked = true;
      starsToggle.checked = true;
      fluidCv.style.visibility = 'visible';
      starCv.style.visibility = 'visible';
      selectHue(44, false);
      if (fluid.ok) applyFluidParams();
      syncFluidRun();
      gblurInput.value = '3';
      GLASS.blur = 3;
      $('mr-gblur-val').textContent = '3';
      grefractionInput.value = '100';
      GLASS.refraction = 1;
      $('mr-grefraction-val').textContent = '100%';
      gdispersionInput.value = '10';
      GLASS.dispersion = 0.1;
      $('mr-gdispersion-val').textContent = '10%';
      gdepthInput.value = '8';
      GLASS.depth = 8;
      $('mr-gdepth-val').textContent = '8';
      gelasticityInput.value = '25';
      GLASS.elasticity = 0.25;
      $('mr-gelasticity-val').textContent = '25%';
      logechoInput.value = '70';
      logoEcho = 70;
      $('mr-logecho-val').textContent = '70';
      rebuildAllPanes();
      if (REDUCED) { renderStars(0); fluidOnce(); applyDrift(0); }
      try {
        if (window.zcode && window.zcode.setWidgetState) window.zcode.setWidgetState({ modelContent: null }).catch(() => {});
      } catch (e) { /* host state unavailable */ }
    });
    fluidToggle.addEventListener('change', () => {
      fluidCv.style.visibility = fluidOn() ? 'visible' : 'hidden';
      syncFluidRun();
      if (REDUCED) fluidOnce();
      saveState();
    });
    starsToggle.addEventListener('change', () => {
      starCv.style.visibility = starsOn() ? 'visible' : 'hidden';
      if (REDUCED && starsOn()) renderStars(0);
      saveState();
    });

    function saveState() {
      try {
        if (window.zcode && window.zcode.setWidgetState) {
          window.zcode.setWidgetState({
            modelContent: {
              parallax: parallaxInput.value,
              density: densityInput.value,
              hue: currentHue,
              depth: currentDepth,
              speed: speedInput.value,
              swirl: swirlInput.value,
              distort: distortInput.value,
              strength: strengthInput.value,
              radius: radiusInput.value,
              gblur: gblurInput.value,
              grefraction: grefractionInput.value,
              gdispersion: gdispersionInput.value,
              gdepth: gdepthInput.value,
              gelasticity: gelasticityInput.value,
              logecho: logechoInput.value,
              fluid: fluidOn(),
              stars: starsOn(),
            },
          }).catch(() => {});
        }
      } catch (e) { /* host state unavailable */ }
    }
    function applyState(mc) {
      if (!mc || typeof mc !== 'object') return;
      if (mc.parallax !== undefined) {
        parallaxInput.value = String(mc.parallax);
        drift.amp = Number(mc.parallax) / 100;
        $('mr-parallax-val').textContent = mc.parallax + '%';
      }
      if (mc.density !== undefined) {
        densityInput.value = String(mc.density);
        starsDensity = Number(mc.density);
        $('mr-density-val').textContent = mc.density;
        buildStars();
      }
      if (mc.depth !== undefined) {
        depthInput.value = String(mc.depth);
        currentDepth = Number(mc.depth);
        $('mr-depth-val').textContent = mc.depth;
      }
      const num = (v) => (v === undefined || v === null || v === '' ? null : Number(v));
      if (num(mc.speed) !== null) { speedInput.value = String(mc.speed); $('mr-speed-val').textContent = mc.speed; }
      if (num(mc.swirl) !== null) { swirlInput.value = String(mc.swirl); $('mr-swirl-val').textContent = mc.swirl; }
      if (num(mc.distort) !== null) { distortInput.value = String(mc.distort); $('mr-distort-val').textContent = mc.distort; }
      if (num(mc.strength) !== null) { strengthInput.value = String(mc.strength); $('mr-strength-val').textContent = mc.strength; }
      if (num(mc.radius) !== null) { radiusInput.value = String(mc.radius); $('mr-radius-val').textContent = mc.radius; }
      if (num(mc.gblur) !== null) { gblurInput.value = String(mc.gblur); GLASS.blur = Number(mc.gblur); $('mr-gblur-val').textContent = mc.gblur; }
      if (num(mc.grefraction) !== null) { grefractionInput.value = String(mc.grefraction); GLASS.refraction = Number(mc.grefraction) / 100; $('mr-grefraction-val').textContent = mc.grefraction + '%'; }
      if (num(mc.gdispersion) !== null) { gdispersionInput.value = String(mc.gdispersion); GLASS.dispersion = Number(mc.gdispersion) / 100; $('mr-gdispersion-val').textContent = mc.gdispersion + '%'; }
      if (num(mc.gdepth) !== null) { gdepthInput.value = String(mc.gdepth); GLASS.depth = Number(mc.gdepth); $('mr-gdepth-val').textContent = mc.gdepth; }
      if (num(mc.gelasticity) !== null) { gelasticityInput.value = String(mc.gelasticity); GLASS.elasticity = Number(mc.gelasticity) / 100; $('mr-gelasticity-val').textContent = mc.gelasticity + '%'; }
      if (num(mc.logecho) !== null) { logechoInput.value = String(mc.logecho); logoEcho = Number(mc.logecho); $('mr-logecho-val').textContent = mc.logecho; }
      rebuildAllPanes();
      if (mc.hue !== undefined) selectHue(Number(mc.hue), false);
      if (fluid.ok) {
        fluid.setColors(toneColors(currentHue, currentDepth));
        applyFluidParams();
      }
      if (typeof mc.fluid === 'boolean') fluidToggle.checked = mc.fluid;
      if (typeof mc.stars === 'boolean') starsToggle.checked = mc.stars;
      fluidCv.style.visibility = fluidOn() ? 'visible' : 'hidden';
      starCv.style.visibility = starsOn() ? 'visible' : 'hidden';
      syncFluidRun();
    }

    /* ================= boot ================= */
    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        resizeStars();
        buildStars();
        if (fluid.ok) fluid.setLogoMask(buildLogoMask());
        if (REDUCED) { renderStars(0); fluidOnce(); }
      }, 120);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopMaster();
        if (fluid.ok) fluid.stopLoop();
      } else if (!REDUCED) {
        startMaster();
        syncFluidRun();
      }
    });

    initFluid();
    resizeStars();
    buildStars();
    paintDots();
    if (fluid.ok) fluid.setLogoMask(buildLogoMask());
    glassDefs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    glassDefs.setAttribute('class', 'mr-glass-defs');
    glassDefs.setAttribute('aria-hidden', 'true');
    stage.appendChild(glassDefs);
    const liquidCard = createGlassPane($('mr-pane-liquid'), {
      radius: 24, liquid: true, elasticityScale: 1,
      content: glassCardContent('液态玻璃', 'SDF 透镜折射 · RGB 色散 · 弹性倾斜'),
    });
    const frostCard = createGlassPane($('mr-pane-frost'), {
      radius: 24, liquid: false, elasticityScale: 1,
      content: glassCardContent('磨砂玻璃', '均匀模糊 · 环形高光 · 无折射'),
    });
    const liquidBtn = createGlassPane(liquidCard.host.querySelector('.pane-btn'), {
      radius: 999, liquid: true, elasticityScale: 0.6, hoverBoost: 0.5,
      content: '<span class="ngs-btn-content">液态按钮</span>',
    });
    const frostBtn = createGlassPane(frostCard.host.querySelector('.pane-btn'), {
      radius: 999, liquid: false, elasticityScale: 0.6, hoverBoost: 0.5,
      content: '<span class="ngs-btn-content">磨砂按钮</span>',
    });
    for (const [btnHost, btnPane] of [[liquidBtn.host, liquidBtn], [frostBtn.host, frostBtn]]) {
      btnHost.addEventListener('pointerenter', () => btnPane.setBrightness(GLASS.brightness + (btnPane.opts.hoverBoost ?? 0)));
      btnHost.addEventListener('pointerleave', () => btnPane.setBrightness(GLASS.brightness));
    }
    let saved = null;
    try {
      saved = window.zcode && window.zcode.widgetState ? window.zcode.widgetState.modelContent : null;
    } catch (e) { saved = null; }
    if (saved) applyState(saved);
    window.addEventListener('zcode:set_globals', (e) => {
      try {
        const mc = e.detail && e.detail.globals && e.detail.globals.widgetState ? e.detail.globals.widgetState.modelContent : null;
        if (mc) applyState(mc);
      } catch (err) { /* ignore */ }
    });
    if (REDUCED) {
      fluidOnce();
      applyDrift(0);
      renderStars(0);
    } else {
      startMaster();
      syncFluidRun();
    }
  })();
  </script>
</div>

</body>
</html>
